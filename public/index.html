<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Agent Simulator</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background-color: #f4f4f9; }
    .container { background: white; padding: 40px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; }
    button:hover { background-color: #0056b3; }
    #status { margin-top: 20px; font-weight: bold; color: #333; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Talk with our AI Employee</h2>
    <p>Click the button below to start a live voice conversation right from your browser.</p>
    <button id="callButton" onclick="toggleCall()">Start Conversation</button>
    <div id="status">Status: Disconnected</div>
  </div>

  <script type="module">
    import { RetellWebClient } from 'https://cdn.jsdelivr.net/npm/retell-client-js-sdk@2.0.7/+esm';

    let isCalling = false;
    const sdk = new RetellWebClient();

    sdk.on("call_started", () => {
      isCalling = true;
      document.getElementById("status").innerText = "Status: Connected (Speaking...)";
      document.getElementById("callButton").innerText = "End Conversation";
      document.getElementById("callButton").style.backgroundColor = "#dc3545";
    });

    sdk.on("call_ended", () => {
      resetButton();
    });

    sdk.on("error", (error) => {
      console.error("Error:", error);
      resetButton();
    });

    window.toggleCall = async function() {
      if (isCalling) {
        sdk.stopCall();
        resetButton();
        return;
      }

      try {
        document.getElementById("status").innerText = "Status: Connecting...";
        const response = await fetch('/api/create-web-call', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await response.json();
        
        if (data.access_token) {
          await sdk.startCall({ accessToken: data.access_token });
        } else {
          alert("Failed to get access token.");
          resetButton();
        }
      } catch (err) {
        console.error(err);
        resetButton();
      }
    };

    function resetButton() {
      isCalling = false;
      document.getElementById("status").innerText = "Status: Disconnected";
      document.getElementById("callButton").innerText = "Start Conversation";
      document.getElementById("callButton").style.backgroundColor = "#007bff";
    }
  </script>
</body>
</html>
